AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Bootstrap one AWS account for GitHub Actions SAM deploys: the GitHub OIDC
  provider and a deploy role that the repo's dispatched workflow assumes.
  Deploy once per environment account (dev/staging/prod).

Parameters:
  OidcThumbprint:
    Type: String
    Default: 1c58a3a8518e8759bf075b76b750d4f2df264fcd
    Description: >-
      SHA-1 fingerprint of the GitHub Actions OIDC server certificate.

Resources:
  GithubActionsOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - !Ref OidcThumbprint
      Tags:
        - Key: Project
          Value: exam-generator
        - Key: Environment
          Value: !Ref Environment

Outputs:
  OidcProviderArn:
    Description: The GitHub Actions OIDC provider ARN for this account.
    Value: !GetAtt GithubActionsOidcProvider.Arn
